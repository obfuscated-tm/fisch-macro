name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  # Releasing from here needs no local clone and no tag push: fill in a version
  # and this run builds every platform, then creates the tag and the release
  # from the commit it built. Left blank it is an ordinary build with no release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0. Blank builds without releasing."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Settles what is being built before anything spends twenty minutes building
  # it: the version the binaries carry, and whether this run ends in a release.
  # A tag that already exists fails here rather than after the whole matrix.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag=""
          fi

          if [ -z "$tag" ]; then
            # Not a release: carry whatever the spec already declares, so a PR
            # build is versioned the same as it is today.
            version="$(sed -n 's/^VERSION = .*"\(.*\)".*/\1/p' fisch-macro.spec)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            version="${tag#v}"
            # This becomes CFBundleVersion, which macOS accepts only as
            # dot-separated numbers — reject anything else before building.
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH tag"
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE}" != "tag" ] \
              && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (release: ${tag:-none})"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -q

  build:
    needs: [test, resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          # macos-13 was the Intel image until GitHub retired it; jobs
          # targeting that label now sit unassigned forever rather than
          # failing. macos-15-intel is its replacement.
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      FISCH_MACRO_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # A Python without tkinter builds a bundle whose GUI silently does not
      # exist — PyInstaller only warns. Fail here instead of shipping it.
      - name: Verify tkinter is present
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Build
        run: pyinstaller fisch-macro.spec --noconfirm

      # macOS ties Accessibility and Screen Recording grants to the code
      # signature. An ad-hoc signature is not a Developer ID — Gatekeeper still
      # warns — but it gives the bundle a stable identity so the permissions
      # the user grants survive relaunches.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/FischMacro.app

      # --list-profiles returns before a WindowTracker is ever constructed, so
      # on its own it proves the bundle imports and packages and nothing about
      # whether window lookup works. --check-backend runs the real platform
      # walk — EnumWindows and the DWM call on Windows, _NET_CLIENT_LIST on
      # X11 — so a broken ctypes signature fails the build here instead of on
      # a user's machine. Finding no game window is expected and is not an error.
      - name: Verify the build runs
        if: runner.os == 'macOS'
        run: |
          dist/FischMacro.app/Contents/MacOS/FischMacro --list-profiles
          dist/FischMacro.app/Contents/MacOS/FischMacro --check-backend

      - name: Verify the build runs
        if: runner.os == 'Windows'
        run: |
          dist/FischMacro/FischMacro-cli.exe --list-profiles
          dist/FischMacro/FischMacro-cli.exe --check-backend

      # ditto preserves the symlinks and executable bits inside a .app that
      # upload-artifact's own zipping would flatten.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/FischMacro.app FischMacro-${{ matrix.artifact }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/FischMacro/* -DestinationPath FischMacro-${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FischMacro-${{ matrix.artifact }}
          path: FischMacro-${{ matrix.artifact }}.zip
          if-no-files-found: error

  # Built inside a Debian bookworm container rather than on the runner's own
  # Ubuntu 24.04: glibc is forward- but not backward-compatible, and a binary
  # linked against Ubuntu's 2.39 will not start on Raspberry Pi OS bookworm
  # (2.36). Building against the older glibc covers both.
  build-linux-arm64:
    needs: [test, resolve]
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    env:
      FISCH_MACRO_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      # gcc, the Python headers and linux-libc-dev are for evdev, which pynput
      # pulls in on Linux: it publishes no aarch64 wheel, so it is compiled
      # here, and it generates its keycode table from linux/input.h.
      # xvfb covers the smoke test below — pyautogui's X11 module opens the
      # display at import time, so the binary cannot even start without one.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3 python3-pip python3-venv python3-tk python3-dev \
            gcc linux-libc-dev binutils libgl1 libglib2.0-0 \
            xvfb xauth

      - uses: actions/checkout@v4

      - name: Build
        run: |
          python3 -m venv /tmp/buildenv
          /tmp/buildenv/bin/pip install --upgrade pip
          /tmp/buildenv/bin/pip install -r requirements.txt pyinstaller
          /tmp/buildenv/bin/python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
          /tmp/buildenv/bin/pyinstaller fisch-macro.spec --noconfirm

      - name: Verify the build runs
        run: |
          xvfb-run -a dist/FischMacro/FischMacro --list-profiles
          xvfb-run -a dist/FischMacro/FischMacro --check-backend

      - name: Package
        run: tar -czf FischMacro-linux-arm64.tar.gz -C dist FischMacro

      - uses: actions/upload-artifact@v4
        with:
          name: FischMacro-linux-arm64
          path: FischMacro-linux-arm64.tar.gz
          if-no-files-found: error

  release:
    needs: [resolve, build, build-linux-arm64]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # --target creates the tag at the commit that was actually built when the
      # run started from the Actions UI. On a tag push the tag already exists
      # and gh ignores it. Note that a tag created here does not start another
      # workflow run — GITHUB_TOKEN pushes never do — which is why this run
      # builds and releases rather than tagging and waiting for a second run.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "${PRERELEASE:-false}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            "${flags[@]}" \
            artifacts/*
