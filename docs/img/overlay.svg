<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#141426"/>
    </linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22304d"/><stop offset="1" stop-color="#13203a"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fffa0"/><stop offset="1" stop-color="#3ad95c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="470" rx="14" fill="url(#bg)"/>
  <text x="44" y="52" fill="#ffffff" font-size="22" font-weight="700">What the macro sees</text>
  <text x="44" y="78" fill="#b0bacb" font-size="14">Every tick: read the track, predict the fish, aim the bar, check progress.</text>

  <!-- game scene panel -->
  <rect x="44" y="104" width="1112" height="196" rx="10" fill="url(#scene)" stroke="#2a2a4a"/>

  <!-- track strip -->
  <rect x="104" y="168" width="992" height="62" rx="8" fill="#0b0f1c" stroke="#39406b"/>
  <!-- control bar -->
  <rect x="470" y="174" width="286" height="50" rx="5" fill="url(#barfill)" opacity="0.92"/>
  <path d="M508 199 l22 -13 v26 z" fill="#0b3d1c" opacity="0.55"/>
  <path d="M718 199 l-22 -13 v26 z" fill="#0b3d1c" opacity="0.55"/>
  <!-- fish now -->
  <rect x="626" y="162" width="7" height="74" rx="3" fill="#ff0000"/>
  <!-- predicted fish -->
  <line x1="690" y1="162" x2="690" y2="236" stroke="#dcdc00" stroke-width="5" stroke-dasharray="9 7"/>
  <!-- aim marker -->
  <path d="M613 150 l11 -16 l11 16 z" fill="#ff78dc"/>
  <line x1="624" y1="150" x2="624" y2="164" stroke="#ff78dc" stroke-width="3"/>

  <!-- progress strip -->
  <rect x="104" y="252" width="992" height="14" rx="7" fill="#0b0f1c" stroke="#39406b"/>
  <rect x="106" y="254" width="631" height="10" rx="5" fill="#ff64ff"/>
  <rect x="700" y="248" width="4" height="22" fill="#ffffff"/>

  <!-- callouts -->
  <g stroke="#6d7799" stroke-width="1.4" fill="none">
    <path d="M629 162 V128 H520"/>
    <path d="M690 236 V266 H812"/>
    <path d="M756 199 H900 V150"/>
    <path d="M737 259 H980"/>
  </g>
  <g font-size="13" fill="#d6dced">
    <text x="514" y="124" text-anchor="end">fish, right now</text>
    <text x="818" y="270">where it will be in ~70 ms</text>
    <text x="900" y="142" text-anchor="middle">bar edges, read by shape</text>
    <text x="986" y="263">catch progress</text>
  </g>

  <!-- legend -->
  <text x="44" y="342" fill="#ffffff" font-size="15" font-weight="700">Overlay key</text>
  <g font-size="13.5" fill="#c8d0e2">
    <rect x="44" y="362" width="26" height="9" rx="2" fill="#ff0000"/><text x="80" y="372">Fish now</text>
    <rect x="248" y="362" width="26" height="9" rx="2" fill="#dcdc00"/><text x="284" y="372">Fish predicted (dashed)</text>
    <rect x="520" y="362" width="26" height="9" rx="2" fill="#50ff50"/><text x="556" y="372">Bar — on target</text>
    <rect x="752" y="362" width="26" height="9" rx="2" fill="#ffdc50"/><text x="788" y="372">Bar — off target</text>
    <rect x="44" y="398" width="26" height="9" rx="2" fill="#ff78dc"/><text x="80" y="408">Where the bar is aimed</text>
    <rect x="248" y="398" width="26" height="9" rx="2" fill="#ff64ff"/><text x="284" y="408">Catch progress</text>
    <rect x="520" y="398" width="26" height="9" rx="2" fill="#ffffff"/><text x="556" y="408">Progress (smoothed)</text>
  </g>
  <text x="752" y="408" fill="#7f89a3" font-size="12.5">Colours match src/detector.py OVERLAY_COLORS</text>
</svg>
